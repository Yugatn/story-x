name: BookGuard backup restore tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backup-restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot, integrity, restoration and tamper rejection
        run: python -m unittest discover -s tests -p 'test_bookguard_*.py' -v
