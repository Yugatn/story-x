name: BookGuard backup restore tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backup-restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot, integrity, restoration and tamper rejection
        run: python -m unittest discover -s tests -p 'test_bookguard_*.py' -v

      - name: Create synthetic transfer fixture
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          with zipfile.ZipFile("bookguard-transfer-fixture.zip", "w") as z:
              z.writestr("README.txt", "BookGuard synthetic restore fixture v1\n")
          with zipfile.ZipFile("bookguard-transfer-fixture.zip") as z:
              assert z.read("README.txt") == b"BookGuard synthetic restore fixture v1\n"
          print("SHA256", hashlib.sha256(open("bookguard-transfer-fixture.zip", "rb").read()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bookguard-synthetic-transfer
          path: bookguard-transfer-fixture.zip
          retention-days: 1

      - name: Create real Git history bundle and verify restore
        run: |
          mkdir -p "$RUNNER_TEMP/bookguard-real"
          python3 scripts/bookguard_bundle.py create --root "$GITHUB_WORKSPACE" --dest "$RUNNER_TEMP/bookguard-real/bundle"
          python3 scripts/bookguard_bundle.py verify --dest "$RUNNER_TEMP/bookguard-real/bundle"
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"bookguard-real"/"bundle"
          meta=json.loads((root/"bundle-manifest.json").read_text())
          assert hashlib.sha256((root/"repository.bundle").read_bytes()).hexdigest()==meta["sha256"]
          print("BOOKGUARD_REAL_BUNDLE_SHA256",meta["sha256"],"HEAD",meta["head"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bookguard-real-git-bundle
          path: ${{ runner.temp }}/bookguard-real/bundle/
          retention-days: 1
          if-no-files-found: error
