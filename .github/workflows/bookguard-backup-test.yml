name: BookGuard backup restore tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backup-restore-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test snapshot, integrity, restoration and tamper rejection
        run: python -m unittest discover -s tests -p 'test_bookguard_*.py' -v

      - name: Create synthetic transfer fixture
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          with zipfile.ZipFile("bookguard-transfer-fixture.zip", "w") as z:
              z.writestr("README.txt", "BookGuard synthetic restore fixture v1\n")
          with zipfile.ZipFile("bookguard-transfer-fixture.zip") as z:
              assert z.read("README.txt") == b"BookGuard synthetic restore fixture v1\n"
          print("SHA256", hashlib.sha256(open("bookguard-transfer-fixture.zip", "rb").read()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bookguard-synthetic-transfer
          path: bookguard-transfer-fixture.zip
          retention-days: 1
