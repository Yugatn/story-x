name: Repository metadata and safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  repository-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate project description, license and secrets
        run: python3 .github/scripts/check_repository_basics.py --json
