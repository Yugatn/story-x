name: Story-X full Word backup

on:
  push:
    branches:
      - backup/word-snapshot-2026-11-03
    paths:
      - .github/workflows/export_story_x_word.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and verify DOCX
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install document library
        run: python -m pip install python-docx==1.2.0
      - name: Assemble the complete Word snapshot
        run: python tools/export_story_x_word.py
      - name: Verify ZIP and manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, zipfile
          p=pathlib.Path('exports/SYUZHET_IKS_POLNOE_RABOCHEE_SOBRANIE_2026_11_03.docx')
          d=json.loads(pathlib.Path('exports/SYUZHET_IKS_SOSTAV_SBORKI_2026_11_03.json').read_text())
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert 'word/document.xml' in z.namelist()
          assert d['sources_total'] >= 640, d['sources_total']
          assert d['sources_by_group']['notion'] >= 4
          assert d['original_text_characters'] > 4_000_000
          print('VERIFIED',p.stat().st_size,'bytes',d['sources_total'],'Markdown sources')
          PY
      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: story-x-full-word-2026-11-03
          path: |
            exports/SYUZHET_IKS_POLNOE_RABOCHEE_SOBRANIE_2026_11_03.docx
            exports/SYUZHET_IKS_SOSTAV_SBORKI_2026_11_03.json
          retention-days: 90
          if-no-files-found: error
      - name: Commit persistent backup in this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Story-X Backup Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f exports/SYUZHET_IKS_POLNOE_RABOCHEE_SOBRANIE_2026_11_03.docx
          git add -f exports/SYUZHET_IKS_SOSTAV_SBORKI_2026_11_03.json
          git commit -m "backup: verified full Word snapshot of Story X"
          git push origin HEAD:backup/word-snapshot-2026-11-03
