name: Russia reform model tests

on:
  push:
    paths:
      - "tools/russia_reform_model.py"
      - "tools/russia_reform_sensitivity.py"
      - "tests/test_russia_reform_sensitivity.py"
      - "tests/test_russia_reform_model.py"
      - ".github/workflows/russia-reform-model.yml"
  pull_request:
    paths:
      - "tools/russia_reform_model.py"
      - "tests/test_russia_reform_model.py"
      - ".github/workflows/russia-reform-model.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run built-in smoke tests
        run: python tools/russia_reform_model.py --test
      - name: Run sensitivity grid smoke test
        run: python tools/russia_reform_sensitivity.py --test
      - name: Export sensitivity CSV
        run: python tools/russia_reform_sensitivity.py --output /tmp/russia_reform_sensitivity.csv
